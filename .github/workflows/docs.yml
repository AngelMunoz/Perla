name: Docs

# Trigger this Action when content in the docs directory is modified
on:
  push:
    branches:
      - dev

# We need some permissions to publish to Github Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Cache Perla packages
        uses: actions/cache@v4
        with:
          path: /home/runner/.config/perla/packages
          key: ${{ runner.os }}-perla-packages-${{ hashFiles('docs/**') }}
          restore-keys: |
            ${{ runner.os }}-perla-packages-
      - name: Set base href for GitHub Pages
        run: |
          sed -i '0,/<head>/s//<head>\n<base href="\/Perla\/">/' docs/index.html
        shell: bash
      - name: Restore tools
        run: dotnet tool restore
      - name: Build code
        run: dotnet build src/Perla -c Release
      - name: Install Dependencies
        run: cd docs && dotnet run --project ../src/Perla -c Release -f net9.0 --no-build --no-restore -- install
      - name: Generate the documentation
        run: cd docs && dotnet run --project ../src/Perla -c Release -f net9.0 --no-build --no-restore -- build
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
