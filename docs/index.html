<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Perla Docs" />
    <meta
      property="og:description"
      content="Documentation for Perla, a Single Page Application development server."
    />
    <meta property="og:url" content="https://angelmunoz.github.io/Perla/" />

    <title>Perla Docs</title>
    <link
      rel="stylesheet"
      media="(prefers-color-scheme:light)"
      href="https://ga.jspm.io/npm:@shoelace-style/shoelace@2.20.1/dist/themes/light.css"
    />
    <link
      rel="stylesheet"
      media="(prefers-color-scheme:dark)"
      href="https://ga.jspm.io/npm:@shoelace-style/shoelace@2.20.1/dist/themes/dark.css"
      onload="document.documentElement.classList.add('sl-theme-dark');"
    />
    <link
      rel="stylesheet"
      media="(prefers-color-scheme:dark)"
      href="https://ga.jspm.io/npm:highlight.js@11.11.1/styles/atom-one-dark.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      media="(prefers-color-scheme:light)"
      href="https://ga.jspm.io/npm:highlight.js@11.11.1/styles/atom-one-light.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@2.6.1/dist/es-module-shims.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        // Use the window load event to keep the page load performant
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { type: "module" })
            .catch(console.warn)
            .then(console.log);
        });
      }
    </script>
    <script data-entry-point type="module" src="./src/main.js"></script>
    <script data-entry-point="standalone" type="module" src="./sw.js"></script>
  </body>
</html>
